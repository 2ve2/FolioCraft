# Additive Workers build target. Local Bun execution still uses src/server.ts.
# Do not deploy until the compatibility gates in docs/CLOUDFLARE.md pass.
name = "foliocraft-api-trial"
main = "src/worker.ts"
compatibility_date = "2026-10-14"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]
workers_dev = true

[alias]
"#image-validation" = "./src/lib/image-validation.worker.ts"

[images]
binding = "IMAGES"

[vars]
NODE_ENV = "production"
TRIAL_SKIP_EMAIL_VERIFICATION = "true"
API_URL = "https://foliocraft-api-trial.bdalrhmnmtwq53.workers.dev"
WEB_URL = "https://foliocraft-trial.bdalrhmnmtwq53.workers.dev"
DB_CONNECT_TIMEOUT_MS = "20000"
# Supply reviewed HTTPS API_URL and WEB_URL before runtime verification.
# DATABASE_URL, BETTER_AUTH_SECRET and provider credentials are Workers secrets.

