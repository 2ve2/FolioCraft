# OpenNext output; this is not a static-only export of the portfolio application.
# Adapter installation/build and Workers preview must pass before deployment.
name = "foliocraft-trial"
main = "worker.ts"
compatibility_date = "2026-10-14"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true

# Runtime deployment identity; the optional SENTRY_DSN belongs in Workers Secrets only.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Trial values for the custom domains attached in the Cloudflare dashboard (lord2ve.tech, a temporary
# domain). Worker names keep their compatibility identifiers. See docs/CLOUDFLARE.md before deployment.
[vars]
API_URL = "https://api.lord2ve.tech"
PORTFOLIO_CACHE_ENABLED = "false"

# Provision manually and uncomment only after reviewing docs/PUBLIC_CACHE.md.
# [[r2_buckets]]
# binding = "NEXT_INC_CACHE_R2_BUCKET"
# bucket_name = "ichnara-portfolio-cache"
#
# [[durable_objects.bindings]]
# name = "NEXT_TAG_CACHE_DO_SHARDED"
# class_name = "DOShardedTagCache"
#
# [[migrations]]
# tag = "portfolio-cache-v1"
# new_sqlite_classes = ["DOShardedTagCache"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

