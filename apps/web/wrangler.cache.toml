# Optional human-operated cache rollout; same trial Worker, disabled until explicitly enabled.
name = "foliocraft-trial"
main = "worker.ts"
compatibility_date = "2026-10-14"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
API_URL = "https://api.lord2ve.tech"
PORTFOLIO_CACHE_ENABLED = "false"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "ichnara-portfolio-cache"

[[durable_objects.bindings]]
name = "NEXT_TAG_CACHE_DO_SHARDED"
class_name = "DOShardedTagCache"

[[migrations]]
tag = "portfolio-cache-v1"
new_sqlite_classes = ["DOShardedTagCache"]
