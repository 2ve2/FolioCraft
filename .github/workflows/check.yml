name: Checks
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run typecheck
      - run: bun run check
      - run: bun run test:web
      - run: bun run build

  # Builds and exercises the exact Workers bundles that are deployed (OpenNext uses webpack,
  # the API uses its Wrangler aliases), which the Bun/Next checks above do not cover.
  workers:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_WRITE_LOGS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test:worker-storage
      - run: bun run test:worker-mail
      - name: API Worker bundle (dry run, no deployment)
        working-directory: apps/api
        run: bunx wrangler deploy --dry-run --outdir ../../work/ci-api-dry-run
      - name: Web Worker build (OpenNext)
        run: bun run --cwd apps/web build:cloudflare

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: folio
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: folio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U folio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://folio:local-ci-only@localhost:5432/folio_test
      BETTER_AUTH_SECRET: ci-only-isolated-test-secret-not-for-production-12345
      API_URL: http://localhost:4000
      WEB_URL: http://localhost:3000
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://folio:local-ci-only@localhost:5432/folio_test
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: folio
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: folio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U folio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://folio:local-ci-only@127.0.0.1:5432/folio_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx --no-install playwright install --with-deps chromium
      - name: Real API and production Next browser journeys
        run: bun run test:e2e
      - name: Browser failure report and traces (disposable accounts only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: |
            work/e2e-report/
            work/e2e-results/
          if-no-files-found: ignore
          retention-days: 7
